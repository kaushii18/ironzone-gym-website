<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Illustration of a gym with weight equipment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151614"/><stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#f5c451" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <g fill="none" stroke="#f5c451" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M470 400h260"/>
    <rect x="400" y="320" width="40" height="160" rx="8"/>
    <rect x="360" y="345" width="34" height="110" rx="8"/>
    <rect x="760" y="320" width="40" height="160" rx="8"/>
    <rect x="806" y="345" width="34" height="110" rx="8"/>
    <rect x="512" y="360" width="176" height="80" rx="10" stroke="#f7f7f4" stroke-opacity=".25"/>
  </g>
  <text x="600" y="620" font-family="Arial, Impact, sans-serif" font-size="76" font-weight="900" fill="#f7f7f4" text-anchor="middle" letter-spacing="6">IRONZONE</text>
  <text x="600" y="668" font-family="Arial, sans-serif" font-size="24" fill="#f5c451" text-anchor="middle" letter-spacing="8">TRAIN HARD</text>
</svg>
