<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Illustration of a heartbeat line for cardio training">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191b19"/><stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  <polyline points="180,420 400,420 460,330 530,500 600,260 670,470 730,420 1020,420"
    fill="none" stroke="#f5c451" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>
  <text x="600" y="660" font-family="Arial, Impact, sans-serif" font-size="70" font-weight="900" fill="#f7f7f4" text-anchor="middle" letter-spacing="4">CARDIO</text>
</svg>
